# Rate limiting for LMS frontend
limit_req_zone $binary_remote_addr zone=lms_web_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name globallms.com *.globallms.com lms.circleone.asia *.lms.circleone.asia;

    # Certbot ACME Challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name globallms.com *.globallms.com lms.circleone.asia *.lms.circleone.asia;

    # SSL certificates (managed by Certbot or Cloudflare Origin CA)
    # ssl_certificate /etc/letsencrypt/live/globallms.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/globallms.com/privkey.pem;

    client_max_body_size 100M;

    # Next.js Frontend Proxy (Port 3050 - no port collision with POS)
    location / {
        limit_req zone=lms_web_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Next.js static asset caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3050;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploads Static Assets
    location /uploads {
        alias /var/www/global_lms/frontend/public/uploads;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
