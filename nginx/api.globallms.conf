# Rate limiting zone for LMS backend API
limit_req_zone $binary_remote_addr zone=lms_api_limit:10m rate=25r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.globallms.com api.lms.circleone.asia;

    # Certbot ACME Challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.globallms.com api.lms.circleone.asia;

    # SSL certificates (managed by Certbot or Cloudflare Origin CA)
    # ssl_certificate /etc/letsencrypt/live/api.globallms.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.globallms.com/privkey.pem;

    client_max_body_size 100M;

    # Express Backend API Proxy (Port 5050 - no collision with POS on 3032)
    location / {
        limit_req zone=lms_api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 90s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Uploads Static Path bypass
    location /uploads {
        alias /var/www/global_lms/backend/uploads;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
